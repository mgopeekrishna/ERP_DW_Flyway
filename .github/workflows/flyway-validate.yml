name: Flyway Validate (CI)

on:
  push:
    branches:
      - main

jobs:
  flyway-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flyway
        uses: redgate/flyway-action@v1
        with:
          flyway-version: '11.14.1'

      - name: Flyway Validate (no DB connection yet)
        run: |
          flyway -locations=filesystem:flyway/sql validate