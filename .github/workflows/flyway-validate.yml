name: Flyway Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  flyway-validate:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # Step 3: Install Flyway CLI
      - name: Install Flyway CLI
        run: |
          curl -L https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/11.14.1/flyway-commandline-11.14.1-linux-x64.tar.gz -o flyway.tar.gz
          tar -xzf flyway.tar.gz
          sudo ln -s $PWD/flyway-11.14.1/flyway /usr/local/bin/flyway
          flyway -v

      # Step 4: Flyway Validate against DEV
      - name: Flyway Validate on DEV
        run: |
          flyway -url=jdbc:sqlserver://${{ secrets.DB_HOST }}:${{ secrets.DB_PORT }};databaseName=${{ secrets.DB_NAME }} \
                 -user=${{ secrets.DB_USER }} \
                 -password=${{ secrets.DB_PASSWORD }} \
                 -locations=filesystem:${{ github.workspace }}/flyway/sql \
                 validate
