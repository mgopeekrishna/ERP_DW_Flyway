name: Flyway Validate POC

on:
  push:
    branches:
      - main

jobs:
  flyway-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Flyway Info (check script versions)
        run: |
          docker run --rm -v ${{ github.workspace }}/flyway/sql:/flyway/sql flyway/flyway:11 info

      - name: Done
        run: echo "Flyway validation check finished ✅"
