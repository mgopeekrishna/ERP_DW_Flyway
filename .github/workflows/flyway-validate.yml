name: Flyway Validate (CI Only)

on:
  push:
    branches:
      - main

jobs:
  flyway-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Flyway
        run: |
          curl -L -o flyway.tar.gz https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/11.14.1/flyway-commandline-11.14.1-linux-x64.tar.gz
          tar -xzf flyway.tar.gz
          sudo mv flyway-11.14.1 /opt/flyway
          sudo ln -s /opt/flyway/flyway /usr/local/bin/flyway
          flyway -v

      - name: Flyway Validate
        run: |
          flyway -locations=filesystem:flyway/sql validate
