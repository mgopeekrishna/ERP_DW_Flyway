name: Flyway Validate on DEV

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  flyway-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download Flyway CLI
        run: |
          FLYWAY_VERSION=11.8.2
          curl -L https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/${FLYWAY_VERSION}/flyway-commandline-${FLYWAY_VERSION}-linux-x64.tar.gz -o flyway.tar.gz
          tar -xzf flyway.tar.gz
          mv flyway-${FLYWAY_VERSION} flyway
          ./flyway/flyway -v

      - name: Run Flyway Validate
        run: |
          ./flyway/flyway -url=jdbc:sqlserver://${{ secrets.DB_HOST }}:${{ secrets.DB_PORT }};databaseName=${{ secrets.DB_NAME }} \
                           -user=${{ secrets.DB_USER }} \
                           -password=${{ secrets.DB_PASSWORD }} \
                           -locations=filesystem:flyway/sql validate
