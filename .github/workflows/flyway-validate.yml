name: Flyway Validate POC

on:
  push:
    branches:
      - main

jobs:
  flyway-validate:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Java (required by Flyway)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ Run Flyway validate in Docker using in-memory H2 database
      - name: Flyway Validate (dry-run, safe)
        run: |
          docker run --rm -v ${{ github.workspace }}/flyway/sql:/flyway/sql \
            flyway/flyway:11 \
            -url=jdbc:h2:mem:testdb \
            -user=sa \
            -password=sa \
            -schemas=PUBLIC \
            validate

      # 4️⃣ Confirmation step
      - name: Done
        run: echo "Flyway validate step finished successfully ✅"
