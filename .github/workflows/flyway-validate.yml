name: Flyway CI/CD

on:
  push:
    branches:
      - main

jobs:
  flyway-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Download Flyway CLI
      run: |
        curl -L https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/11.14.1/flyway-commandline-11.14.1-linux-x64.tar.gz
        tar -xzf flyway.tar.gz
        mv flyway-11.14.1 flyway

    - name: Validate Flyway migrations on DEV
      run: ./flyway/flyway -url=jdbc:sqlserver://${{ secrets.DB_HOST }}:${{ secrets.DB_PORT }};databaseName=${{ secrets.DB_NAME }} -user=${{ secrets.DB_USER }} -password=${{ secrets.DB_PASSWORD }} -locations=filesystem:${{ github.workspace }}/flyway/sql validate
