name: Flyway Validate (CI)

on:
  push:
    branches:
      - main

jobs:
  flyway-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Java (Flyway needs it internally)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Flyway validate using official Docker image
      - name: Flyway Validate (Docker)
        uses: docker://flyway/flyway:11
        with:
          entrypoint: flyway
        run: |
          flyway -locations=filesystem:/flyway/sql validate

      # Optional: just to confirm step completion
      - name: Done
        run: echo "Flyway validate step finished"
