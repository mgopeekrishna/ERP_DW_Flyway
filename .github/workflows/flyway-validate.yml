name: Flyway Validate (CI Only)

on:
  push:
    branches:
      - main

jobs:
  flyway-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Flyway
        run: |
          wget -qO- https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/11.14.1/flyway-commandline-11.14.1-linux-x64.tar.gz | tar xvz
          sudo ln -s $(pwd)/flyway-11.14.1/flyway /usr/local/bin/flyway

      - name: Flyway Validate
        run: |
          flyway -locations=filesystem:flyway/sql validate
